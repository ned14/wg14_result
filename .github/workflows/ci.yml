name: CI

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '0 0 1 * *'

jobs:
  ESP32:
    name: ESP32
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11]
    env:
      NAME: ESP32
          
    steps:
    - uses: actions/checkout@v4

    # The esp-idf container is entered explicitly rather than through a third-party
    # action, because an action's container cannot hand its output back to the
    # runner: a failure inside it arrived here as "exit code 2" with nothing to
    # annotate. With `docker run` the log is a file in the workspace, so the same
    # annotation step the other lanes use can read it.
    - name: Configure and Build ESP32
      shell: bash
      run: |
        set -o pipefail
        docker run --rm -v "$PWD":/project -w /project espressif/idf:release-v5.4 \
          bash -lc '. /opt/esp/idf/export.sh > /dev/null && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_TESTS_AS_CXX=OFF -DBUILD_SWIG_WRAPPERS=OFF -DBUILD_RUST_WRAPPERS=OFF && cmake --build . --parallel' \
          2>&1 | tee esp32.log
    - name: Annotate the errors
      if: failure()
      shell: bash
      run: |
        hits=0
        for f in esp32.log; do
          [ -f "$f" ] || continue
          out=$(grep -m 10 -iE 'error|FAILED|CMake Error' "$f" || true)
          if [ -n "$out" ]; then echo "$out" | sed 's/^/::error::/'; hits=1; fi
        done
        if [ "$hits" -eq 0 ]; then
          [ -f esp32.log ] && tail -10 esp32.log | sed 's/^/::error::log tail: /' || echo "::error::the container produced no log at all: the failure is before the build starts"
        fi

  Linux:
    name: Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        debug: [Debug, Release]
        standard: [90, 11, 23]
        shared: [OFF, ON]
        build_as_cxx: [OFF, ON]
        # Quoted: unquoted OFF/ON are YAML booleans, and this one is compared to a string.
        swig: ["OFF"]
        include:
        - compiler: gcc
          debug: Release
          standard: 23
          shared: OFF
          build_as_cxx: ON
          swig: "ON"
        - compiler: clang
          debug: Release
          standard: 23
          shared: OFF
          build_as_cxx: ON
          swig: "ON"
    env:
      NAME: Linux-${{ matrix.compiler }}-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}-${{ matrix.build_as_cxx }}-swig${{ matrix.swig }}
      CC: ${{ matrix.compiler }}
          
    steps:
    - uses: actions/checkout@v4
    # The toolchain step caches with Swatinem/rust-cache, whose post step wants a
    # `target/` directory to save. Nothing here builds Rust - the wrappers are off by
    # default - so that post step failed path validation and left a failure-level
    # annotation on jobs that had otherwise passed. The cache is redundant here.
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false

    - name: Install the wrapper toolchain
      if: matrix.swig == 'ON'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y swig python3-dev

    - name: Show the compilers in use
      shell: bash
      run: |
        ${CC} --version | head -1
        ${CC/cc/}++ --version | head -1

    - name: Configure Linux
      shell: bash
      run: |
        mkdir build && cd build
        export CXX=${CC/cc/}++
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DBUILD_TESTS_AS_CXX=${{ matrix.build_as_cxx }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake -DBUILD_SWIG_WRAPPERS=${{ matrix.swig }}

    - name: Build Linux
      shell: bash
      run: |
        set -o pipefail
        cd build && cmake --build . --parallel 2>&1 | tee build.log


    - name: CMake tests Linux
      shell: bash
      run: |
        set -o pipefail
        cd build && ctest --output-on-failure --timeout 300 -E benchmark 2>&1 | tee ctest.log
    # The job log lives on storage this project's own tooling cannot reach (and the
    # annotations endpoint does not), so the first errors are re-emitted as
    # workflow commands, which GitHub records as check-run annotations that the API
    # will serve. If nothing matches, the tail of the log is annotated instead: a
    # failure that reports only "exit code 1" costs a human round trip.
    - name: Annotate the errors
      if: failure()
      shell: bash
      run: |
        logs="build/build.log build.log build/ctest.log"
        hits=0
        for f in $logs; do
          [ -f "$f" ] || continue
          out=$(grep -m 10 -iE 'error|FAILED|undefined symbol|tests failed|assertion' "$f" || true)
          if [ -n "$out" ]; then
            echo "$out" | sed 's/^/::error::/'
            hits=1
          fi
        done
        if [ "$hits" -eq 0 ]; then
          for f in $logs; do
            [ -f "$f" ] || continue
            tail -5 "$f" | sed 's/^/::error::log tail: /'
            break
          done
          echo "::error::no log file matched; the failing step produced no build log (check the step order)"
        fi
      
  BigEndian:
    name: s390x big endian (qemu)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
    env:
      NAME: s390x-${{ matrix.debug }}

    steps:
    - uses: actions/checkout@v4

    # The status word's two halves swap places on a big endian machine, and an
    # x86 runner can never see that, so it is built for s390x and run under
    # qemu user emulation. The emulator is wired in through the toolchain file,
    # so `ctest` executes the cross built binaries.
    - name: Install the s390x cross toolchain and qemu
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static
        # The unversioned cross package names are not on every image; the versioned
        # ones are, and the toolchain file takes whichever compiler it is given.
        sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu ||
          sudo apt-get install -y gcc-13-s390x-linux-gnu g++-13-s390x-linux-gnu ||
          sudo apt-get install -y gcc-14-s390x-linux-gnu g++-14-s390x-linux-gnu

    - name: Configure and build s390x
      shell: bash
      run: |
        set -o pipefail
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/qemu-s390x-toolchain.cmake \
          -DCMAKE_BUILD_TYPE=${{ matrix.debug }} \
          -DBUILD_SWIG_WRAPPERS=OFF -DBUILD_RUST_WRAPPERS=OFF
        cmake --build build --parallel 2>&1 | tee build.log



    - name: CMake tests s390x
      shell: bash
      run: |
        set -o pipefail
        ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee build/ctest.log
    # The job log lives on storage this project's own tooling cannot reach (and the
    # annotations endpoint does not), so the first errors are re-emitted as
    # workflow commands, which GitHub records as check-run annotations that the API
    # will serve. If nothing matches, the tail of the log is annotated instead: a
    # failure that reports only "exit code 1" costs a human round trip.
    - name: Annotate the errors
      if: failure()
      shell: bash
      run: |
        logs="build/build.log build.log build/ctest.log"
        hits=0
        for f in $logs; do
          [ -f "$f" ] || continue
          out=$(grep -m 10 -iE 'error|FAILED|undefined symbol|tests failed|assertion' "$f" || true)
          if [ -n "$out" ]; then
            echo "$out" | sed 's/^/::error::/'
            hits=1
          fi
        done
        if [ "$hits" -eq 0 ]; then
          for f in $logs; do
            [ -f "$f" ] || continue
            tail -5 "$f" | sed 's/^/::error::log tail: /'
            break
          done
          echo "::error::no log file matched; the failing step produced no build log (check the step order)"
        fi

  MacOS:
    name: Mac OS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11, 23]
        shared: [OFF, ON]
        build_as_cxx: [OFF, ON]
    env:
      NAME: MacOS-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}-${{ matrix.build_as_cxx }}
          
    steps:
    - uses: actions/checkout@v4
    # The toolchain step caches with Swatinem/rust-cache, whose post step wants a
    # `target/` directory to save. Nothing here builds Rust - the wrappers are off by
    # default - so that post step failed path validation and left a failure-level
    # annotation on jobs that had otherwise passed. The cache is redundant here.
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false

    - name: Configure Mac OS
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DBUILD_TESTS_AS_CXX=${{ matrix.build_as_cxx }} -DBUILD_SWIG_WRAPPERS=OFF -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Build Mac OS
      shell: bash
      run: |
        set -o pipefail
        cd build && cmake --build . --parallel 2>&1 | tee build.log



    - name: CMake tests Mac OS
      shell: bash
      run: |
        set -o pipefail
        cd build && ctest --output-on-failure --timeout 300 -E benchmark 2>&1 | tee ctest.log
    # The job log lives on storage this project's own tooling cannot reach (and the
    # annotations endpoint does not), so the first errors are re-emitted as
    # workflow commands, which GitHub records as check-run annotations that the API
    # will serve. If nothing matches, the tail of the log is annotated instead: a
    # failure that reports only "exit code 1" costs a human round trip.
    - name: Annotate the errors
      if: failure()
      shell: bash
      run: |
        logs="build/build.log build.log build/ctest.log"
        hits=0
        for f in $logs; do
          [ -f "$f" ] || continue
          out=$(grep -m 10 -iE 'error|FAILED|undefined symbol|tests failed|assertion' "$f" || true)
          if [ -n "$out" ]; then
            echo "$out" | sed 's/^/::error::/'
            hits=1
          fi
        done
        if [ "$hits" -eq 0 ]; then
          for f in $logs; do
            [ -f "$f" ] || continue
            tail -5 "$f" | sed 's/^/::error::log tail: /'
            break
          done
          echo "::error::no log file matched; the failing step produced no build log (check the step order)"
        fi
      
  Windows:
    name: Windows VS2022
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11, 17]
        shared: [OFF, ON]
        build_as_cxx: [OFF, ON]
    env:
      NAME: Windows-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}-${{ matrix.build_as_cxx }}
          
    steps:
    - uses: actions/checkout@v4
    # The toolchain step caches with Swatinem/rust-cache, whose post step wants a
    # `target/` directory to save. Nothing here builds Rust - the wrappers are off by
    # default - so that post step failed path validation and left a failure-level
    # annotation on jobs that had otherwise passed. The cache is redundant here.
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false

    - name: Configure WinVS2022
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DBUILD_TESTS_AS_CXX=${{ matrix.build_as_cxx }} -DBUILD_SWIG_WRAPPERS=OFF -DBUILD_RUST_WRAPPERS=OFF -DCMAKE_C_FLAGS=/fsanitize:address

    - name: Build WinVS2022
      shell: bash
      run: |
        set -o pipefail
        cd build && cmake --build . --config ${{ matrix.debug }} --parallel 2>&1 | tee build.log



    - name: CMake tests WinVS2022
      shell: bash
      run: |
        set -o pipefail
        cd build && ctest -C ${{ matrix.debug }} --output-on-failure --timeout 300 -E benchmark 2>&1 | tee ctest.log
    # The job log lives on storage this project's own tooling cannot reach (and the
    # annotations endpoint does not), so the first errors are re-emitted as
    # workflow commands, which GitHub records as check-run annotations that the API
