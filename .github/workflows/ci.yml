name: CI

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '0 0 1 * *'

jobs:
  ESP32:
    name: ESP32
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11]
    env:
      NAME: ESP32
          
    steps:
    - uses: actions/checkout@v4

    - name: Configure and Build ESP32
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: latest
        target: esp32c3
        path: .
        command: mkdir build && cd build && cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_TESTS_AS_CXX=OFF -DBUILD_SWIG_WRAPPERS=OFF -DBUILD_RUST_WRAPPERS=OFF && cmake --build . --parallel

  Linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        debug: [Debug, Release]
        standard: [90, 11, 23]
        shared: [OFF, ON]
        build_as_cxx: [OFF, ON]
    env:
      NAME: Linux-${{ matrix.compiler }}-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}-${{ matrix.build_as_cxx }}
      CC: ${{ matrix.compiler }}
          
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Configure Linux
      shell: bash
      run: |
        mkdir build && cd build
        export CXX=${CC/cc/}++
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DBUILD_TESTS_AS_CXX=${{ matrix.build_as_cxx }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Build Linux
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests Linux
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark
      
  BigEndian:
    name: s390x big endian (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
    env:
      NAME: s390x-${{ matrix.debug }}

    steps:
    - uses: actions/checkout@v4

    # The status word's two halves swap places on a big endian machine, and an
    # x86 runner can never see that, so it is built for s390x and run under
    # qemu user emulation. The emulator is wired in through the toolchain file,
    # so `ctest` executes the cross built binaries.
    - name: Install the s390x cross toolchain and qemu
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu qemu-user-static

    - name: Configure and build s390x
      shell: bash
      run: |
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/qemu-s390x-toolchain.cmake \
          -DCMAKE_BUILD_TYPE=${{ matrix.debug }} \
          -DBUILD_SWIG_WRAPPERS=OFF -DBUILD_RUST_WRAPPERS=OFF
        cmake --build build --parallel

    - name: CMake tests s390x
      shell: bash
      run: ctest --test-dir build --output-on-failure --timeout 300

  MacOS:
    name: Mac OS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11, 23]
        shared: [OFF, ON]
        build_as_cxx: [OFF, ON]
    env:
      NAME: MacOS-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}-${{ matrix.build_as_cxx }}
          
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Configure Mac OS
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DBUILD_TESTS_AS_CXX=${{ matrix.build_as_cxx }} -DBUILD_SWIG_WRAPPERS=OFF -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Build Mac OS
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests Mac OS
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark
      
  Windows:
    name: Windows VS2022
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11, 17]
        shared: [OFF, ON]
        build_as_cxx: [OFF, ON]
    env:
      NAME: Windows-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}-${{ matrix.build_as_cxx }}
          
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Configure WinVS2022
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DBUILD_TESTS_AS_CXX=${{ matrix.build_as_cxx }} -DBUILD_SWIG_WRAPPERS=OFF -DBUILD_RUST_WRAPPERS=OFF -DCMAKE_C_FLAGS=/fsanitize:address

    - name: Build WinVS2022
      shell: bash
      run: cd build && cmake --build . --config ${{ matrix.debug }} --parallel

    - name: CMake tests WinVS2022
      shell: bash
      run: cd build && ctest -C ${{ matrix.debug }} --output-on-failure --timeout 300 -E benchmark
